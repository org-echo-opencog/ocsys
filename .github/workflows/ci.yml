name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        lua-version: ['5.4']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Lua
      run: |
        sudo apt-get update
        sudo apt-get install -y lua${{ matrix.lua-version }} liblua${{ matrix.lua-version }}-dev
    
    - name: Build library
      run: make
    
    - name: Run tests
      run: make test
    
    - name: Verify build artifacts
      run: |
        test -f libsys.so
        echo "Build successful - libsys.so created"
